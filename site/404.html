<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Estate Planner</title>
<!-- Self-contained: served at any depth by GitHub Pages, so no external assets. -->
<style>
  :root{--paper:#faf8f3;--ink:#23201c;--ink-soft:#5c554c;--line:#c9c2b6;--accent:#825e12;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif;line-height:1.55;padding:24px;}
  .box{max-width:34rem;}
  .code{font-family:"Source Sans 3",system-ui,sans-serif;font-size:12px;font-style:italic;color:var(--accent);margin:0 0 14px;}
  h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:34px;line-height:1.1;
    letter-spacing:-.01em;margin:0 0 12px;}
  p{color:var(--ink-soft);font-size:15px;margin:0 0 24px;}
  a.btn{display:inline-block;font-size:14px;font-weight:500;background:var(--ink);color:var(--paper);
    border-radius:7px;padding:11px 20px;text-decoration:none;margin-right:10px;}
  a.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
</style>
</head>
<body>
  <div class="box">
    <p class="code">Error 404</p>
    <h1>That page isn't here</h1>
    <p>The link may be out of date — this site was reorganized so each state lives under its own path (for example, the New York timeline is now at <span style="font-family:'Source Sans 3',system-ui,sans-serif">/ny/timeline/</span>). Educational information only, not legal advice.</p>
    <p><a class="btn" id="home" href="/">Go to the homepage</a><a class="btn ghost" id="ny" href="/ny/">New York</a></p>
  </div>
  <script>
    // Resolve the site root whether hosted at a subpath (GitHub Pages project
    // site) or a root domain (Cloudflare), without hardcoding either.
    (function(){
      var base = "/";
      if (/\.github\.io$/.test(location.hostname)) {
        var m = location.pathname.match(/^(\/[^\/]+\/)/);
        if (m) base = m[1];              // project subpath, e.g. /estate-planner/
      }
      document.getElementById("home").href = base;
      document.getElementById("ny").href = base + "ny/";
    })();
  </script>
</body>
</html>
